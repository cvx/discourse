name: Upload the bundle analysis artifact
description: Adds pr.json next to $RUNNER_TEMP/artifact/report.json and uploads both for bundle-analysis-comment.yml.

runs:
  using: composite
  steps:
    - name: Record the PR
      shell: bash
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      run: >
        node -e 'require("fs").writeFileSync(process.argv[1], JSON.stringify({
          number: Number(process.env.PR_NUMBER),
          head_sha: process.env.HEAD_SHA,
          head_repo: process.env.HEAD_REPO,
        }))' "$RUNNER_TEMP/artifact/pr.json"

    - uses: actions/upload-artifact@v7
      with:
        name: bundle-analysis
        path: |
          ${{ runner.temp }}/artifact/report.json
          ${{ runner.temp }}/artifact/pr.json
        retention-days: 7
        if-no-files-found: error
